steps:
  # Build the container image
  - name: 'gcr.io/cloudbuilders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/taskflow-api:$COMMIT_SHA', './backend']
    dir: '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloudbuilders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/taskflow-api:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'taskflow-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/taskflow-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/taskflow-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
